# GitLab CI Pipeline for MilkV Duo S MIDI Adapter
# Builds the SD card image with MIDI adapter configuration

stages:
  - build
  - package

variables:
  # Target configuration for MilkV Duo S with MIDI adapter
  TARGET_BOARD: "milkv-duos-glibc-arm64-sd"
  ARCH: "riscv"
  GIT_DEPTH: 1
  GIT_SUBMODULE_STRATEGY: recursive

# Docker image with build dependencies
.build_template:
  image: ubuntu:22.04
  before_script:
    - echo "Setting up build environment..."
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y 
        pkg-config build-essential ninja-build automake autoconf libtool wget curl
        git gcc libssl-dev bc slib squashfs-tools android-sdk-libsparse-utils jq tree
        python3-distutils scons parallel python3-dev python3-pip device-tree-compiler
        ssh cpio fakeroot libncurses5 flex bison libncurses5-dev genext2fs rsync unzip
        dosfstools mtools tcl openssh-client cmake expect python-is-python3 python3-jinja2 zstd
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - echo "Build environment ready"

# Build MilkV Duo S MIDI Adapter Image
build:duos-midi-adapter:
  extends: .build_template
  stage: build
  tags:
    - docker
  timeout: 3h
  script:
    - echo "Building MilkV Duo S MIDI Adapter..."
    - echo "Target board: ${TARGET_BOARD}"
    
    # Clone host tools
    - echo "Cloning host tools..."
    - git clone --depth=1 https://github.com/milkv-duo/host-tools.git || true
    
    # Download buildroot packages cache
    - echo "Downloading buildroot packages..."
    - wget -q https://github.com/milkv-duo/duo-buildroot-sdk-v2/releases/download/dl/dl.tar || true
    - if [ -f dl.tar ]; then tar xf dl.tar -C buildroot/ || true; fi
    
    # Build the image
    - echo "Starting build process..."
    - ./build.sh ${TARGET_BOARD}
    
    # Check if build was successful
    - |
      if [ ! -d out ]; then
        echo "ERROR: Build failed - no output directory"
        exit 1
      fi
    
    - ls -lh out/
    - echo "Build completed successfully"
    
    # Compress output for faster upload
    - echo "Compressing build artifacts..."
    - cd out
    - for file in *.img *.zip; do
        if [ -f "$file" ]; then
          echo "Compressing $file..."
          zstd -T0 --rm "$file"
        fi
      done
    - cd ..
    - ls -lh out/
    
  artifacts:
    name: "milkv-duos-midi-adapter-${CI_COMMIT_SHORT_SHA}"
    paths:
      - out/*.img.zst
      - out/*.zip.zst
    expire_in: 30 days
    when: on_success

# Create release package with documentation
package:midi-adapter-release:
  stage: package
  image: alpine:latest
  tags:
    - docker
  dependencies:
    - build:duos-midi-adapter
  before_script:
    - apk add --no-cache zstd tar gzip
  script:
    - echo "Creating release package..."
    - mkdir -p release/
    
    # Copy compressed images
    - cp out/*.zst release/ || true
    
    # Copy documentation
    - cp MIDI_ADAPTER.md release/
    - cp README.md release/
    - cp -r device/generic/rootfs_overlay/duos/root/midi-adapter release/midi-adapter-config-examples
    
    # Create README for release
    - |
      cat > release/README.txt <<EOF
      MilkV Duo S - USB MIDI to DIN MIDI and Network MIDI Adapter
      ==============================================================
      
      Build Information:
      - Commit: ${CI_COMMIT_SHORT_SHA}
      - Branch: ${CI_COMMIT_REF_NAME}
      - Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
      - Pipeline: ${CI_PIPELINE_ID}
      
      Contents:
      - *.img.zst: Compressed SD card image
      - MIDI_ADAPTER.md: Complete setup and usage documentation
      - README.md: Project overview
      - midi-adapter-config-examples/: Configuration examples
      
      Quick Start:
      1. Decompress the .img.zst file:
         zstd -d milkv-duos-*.img.zst
      
      2. Flash to SD card (Linux):
         sudo dd if=milkv-duos-*.img of=/dev/sdX bs=4M status=progress
      
      3. Boot MilkV Duo S and configure:
         ssh root@<duo-ip>
         cd /root/midi-adapter
         nano config.json
         
      4. See MIDI_ADAPTER.md for complete documentation
      
      For support and updates:
      https://github.com/miathedev/duo-buildroot-sdk-v2
      EOF
    
    # Create tarball
    - cd release
    - tar -czf ../milkv-duos-midi-adapter-${CI_COMMIT_SHORT_SHA}.tar.gz *
    - cd ..
    - ls -lh *.tar.gz
    - echo "Release package created successfully"
    
  artifacts:
    name: "milkv-duos-midi-adapter-release-${CI_COMMIT_SHORT_SHA}"
    paths:
      - milkv-duos-midi-adapter-*.tar.gz
      - release/
    expire_in: 90 days
    when: on_success

# Optional: Quick build check for merge requests
build:check-mr:
  extends: .build_template
  stage: build
  tags:
    - docker
  only:
    - merge_requests
  timeout: 30m
  script:
    - echo "Quick build check for merge request..."
    - echo "Verifying build configuration..."
    
    # Clone host tools
    - git clone --depth=1 https://github.com/milkv-duo/host-tools.git || true
    
    # Just verify the build can start (don't run full build)
    - source build/envsetup_milkv.sh list
    - echo "Build configuration verified"
    
    # Validate MIDI adapter files
    - echo "Validating MIDI adapter configuration..."
    - test -f device/generic/rootfs_overlay/duos/root/midi-adapter/midi_adapter.py
    - test -f device/generic/rootfs_overlay/duos/root/midi-adapter/config.json
    - test -f device/generic/rootfs_overlay/duos/etc/init.d/S99midi-adapter
    - python3 -m py_compile device/generic/rootfs_overlay/duos/root/midi-adapter/midi_adapter.py
    - echo "MIDI adapter files validated successfully"
  allow_failure: false

# Optional: Build on schedule (nightly builds)
build:nightly:
  extends: build:duos-midi-adapter
  only:
    - schedules
  variables:
    TARGET_BOARD: "milkv-duos-glibc-arm64-sd"
  artifacts:
    expire_in: 7 days
